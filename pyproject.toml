# spasmlang bundles a C++ extension (spasm._core), so the build backend has to
# be able to compile one; setup.py generates the per-interpreter opcode tables.
[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "spasmlang"
dynamic = ["version"]
description = 'Simple Python Assembly Language'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["python", "assembly", "development"]
authors = [{ name = "Gabriele N. Tornetta", email = "phoenix1987@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.optional-dependencies]
# Only spasm.buildbackend needs a TOML parser (to read pyproject.toml's
# [tool.spasm.build] config); everything else in the package doesn't. A
# downstream project opts in with `requires = ["spasmlang[buildbackend]", ...]`
# in its own [build-system] table.
buildbackend = ["tomli>=2; python_version<'3.11'"]

[project.urls]
Documentation = "https://github.com/P403n1x87/spasmlang#readme"
Issues = "https://github.com/P403n1x87/spasmlang/issues"
Source = "https://github.com/P403n1x87/spasmlang"

[project.scripts]
spasm = "spasm.__main__:main"

[tool.setuptools]
packages = ["spasm"]

# spasm._core is a C++ extension and so carries no annotations of its own;
# _core.pyi is hand-written and has to be shipped for downstream type checkers
# to see anything at all below spasm.bytecode.
[tool.setuptools.package-data]
spasm = ["py.typed", "_core.pyi"]

[tool.setuptools_scm]
version_file = "spasm/_version.py"

[tool.hatch.envs.tests]
dependencies = ["coverage[toml]>=6.5", "pytest", "tomli>=2; python_version<'3.11'"]
[tool.hatch.envs.tests.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.tests.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.lint]
detached = true
dependencies = ["mypy>=1.0.0", "ruff~=0.16.0"]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive spasm {args}"
style = [
  "ruff check spasm/ tests/ {args}",
  "ruff format --check --diff spasm/ tests/ {args}",
]
fmt = ["ruff format spasm/ tests/ {args}", "ruff check --fix spasm/ tests/ {args}", "style"]
all = ["style", "typing"]

[tool.cibuildwheel]
# The extension embeds opcode tables for the interpreter it is built against,
# so there is no abi3/limited-API build: one wheel per minor version.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# 32-bit Linux only — musl and glibc are both built on the other
# architectures. Nothing in the extension assumes 64-bit; this is about demand
# and toolchain support, since manylinux_2_28 onwards has no i686 variant.
skip = "*_i686"
test-command = "pytest {project}/tests"
test-requires = ["pytest"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105",
  "S106",
  "S107",
  # Ignore complexity
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["spasm"]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
  # Tests can use magic values, assertions, and relative imports
  "PLR2004",
  "S101",
  "TID252",
  # An import inside a test is often the point: some of these exercise import
  # order, and others only apply to a subset of the supported versions.
  "PLC0415",
  # Exception messages in a test are throwaway; the message-in-a-variable
  # dance only earns its keep in library code.
  "EM101",
  "EM102",
  # Uppercase locals in a test body stand for opcodes and code flags, which is
  # how they are spelled everywhere else.
  "N806",
  # The corpus and round-trip sweeps print a summary of what they covered,
  # which is the only way to see it under `pytest -s`.
  "T201",
]
# The framework harness runs as a real sitecustomize, so it prints diagnostics,
# imports lazily below module level, and swallows exceptions rather than taking
# the interpreter down with it. `module.py` is vendored from ddtrace and kept
# close to its upstream shape.
"tests/frameworks/*" = ["ARG002", "E402", "FBT001", "FBT002", "S108", "S110", "T201"]

[tool.coverage.run]
source_pkgs = ["spasm", "tests"]
branch = true
parallel = true
omit = ["spasm/_version.py"]

[tool.coverage.paths]
spasmlang = ["spasm"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
